<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ML Service Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #111827;
        --panel-2: #0f172a;
        --line: #243044;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --soft: #cbd5e1;
        --green: #22c55e;
        --red: #ef4444;
        --amber: #f59e0b;
        --blue: #38bdf8;
        --violet: #a78bfa;
        --cyan: #2dd4bf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(11, 16, 32, 0.96);
        backdrop-filter: blur(10px);
      }

      .header-inner {
        max-width: 1500px;
        margin: 0 auto;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 760;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 720;
        color: var(--soft);
      }

      button {
        border: 1px solid #31577a;
        border-radius: 6px;
        background: #14324a;
        color: #ecfeff;
        padding: 9px 12px;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #17415f;
      }

      main {
        max-width: 1500px;
        margin: 0 auto;
        padding: 18px 20px 28px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
        flex-wrap: wrap;
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      .overview {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .two-col {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      .wide-left {
        grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr);
      }

      .panel,
      .metric,
      .stage,
      .prediction,
      .connection {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .panel {
        padding: 14px;
        min-width: 0;
      }

      .metric {
        padding: 13px;
        min-height: 90px;
      }

      .metric-label,
      .field-label {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .metric-value {
        margin-top: 7px;
        font-size: 24px;
        line-height: 1.1;
        font-weight: 780;
        overflow-wrap: anywhere;
      }

      .metric-sub {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 12px;
        color: var(--soft);
        background: #0b1220;
        white-space: nowrap;
      }

      .pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }

      .pill.ok::before {
        background: var(--green);
      }

      .pill.warn::before {
        background: var(--amber);
      }

      .pill.bad::before {
        background: var(--red);
      }

      .value-ok {
        color: var(--green);
      }

      .value-warn {
        color: var(--amber);
      }

      .value-bad {
        color: var(--red);
      }

      .connections {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .connection {
        padding: 12px;
        min-width: 0;
      }

      .connection-head,
      .prediction-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .connection-name,
      .prediction-id {
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .connection-detail {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .stages {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .stage {
        padding: 12px;
        min-height: 150px;
        position: relative;
      }

      .stage-title {
        margin-top: 9px;
        font-size: 14px;
        font-weight: 760;
      }

      .stage-meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .stage-count {
        position: absolute;
        right: 10px;
        bottom: 10px;
        color: var(--blue);
        font-weight: 780;
      }

      .score-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .score-box {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
        padding: 10px;
      }

      .score-value {
        margin-top: 6px;
        font-size: 20px;
        font-weight: 760;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 8px 6px;
        text-align: left;
        font-size: 13px;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 650;
      }

      .matrix {
        table-layout: fixed;
      }

      .matrix th,
      .matrix td {
        text-align: center;
      }

      .matrix-cell {
        font-size: 22px;
        font-weight: 780;
      }

      .matrix-good {
        color: var(--green);
      }

      .matrix-risk {
        color: var(--amber);
      }

      .predictions {
        display: grid;
        gap: 10px;
        max-height: 520px;
        overflow: auto;
        padding-right: 2px;
      }

      .prediction {
        padding: 12px;
      }

      .prediction-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .feature-list {
        margin-top: 10px;
        display: grid;
        gap: 6px;
      }

      .feature-row {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) 80px 80px;
        gap: 8px;
        color: var(--soft);
        font-size: 12px;
        align-items: center;
      }

      .bar {
        height: 5px;
        border-radius: 999px;
        background: #1f2937;
        overflow: hidden;
      }

      .bar > span {
        display: block;
        height: 100%;
        background: var(--cyan);
      }

      pre {
        margin: 0;
        max-height: 420px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #050914;
        padding: 10px;
        color: #d1d5db;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .events {
        display: grid;
        gap: 7px;
        max-height: 420px;
        overflow: auto;
      }

      .event {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 7px;
        font-size: 12px;
      }

      .event-time {
        color: var(--muted);
      }

      .event.error {
        color: #fecaca;
      }

      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 10px 0;
      }

      .section-gap {
        margin-top: 12px;
      }

      @media (max-width: 1180px) {
        .overview,
        .stages {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .connections,
        .score-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .wide-left,
        .two-col {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .header-inner {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          padding: 14px 12px 22px;
        }

        .overview,
        .connections,
        .stages,
        .score-grid,
        .prediction-grid {
          grid-template-columns: 1fr;
        }

        .event {
          grid-template-columns: 1fr;
        }

        .feature-row {
          grid-template-columns: minmax(0, 1fr) 64px 64px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div>
          <h1>ML Service Monitor</h1>
          <div class="toolbar">
            <span id="overall-pill" class="pill warn">Loading</span>
            <span id="last-updated">Last updated: never</span>
            <span id="worker">worker: -</span>
          </div>
        </div>
        <button id="refresh">Refresh now</button>
      </div>
    </header>

    <main>
      <section class="grid overview" id="overview"></section>

      <section class="panel section-gap">
        <h2>Connections</h2>
        <div class="connections" id="connections"></div>
      </section>

      <section class="panel section-gap">
        <h2>Live Pipeline</h2>
        <div class="stages" id="pipeline"></div>
      </section>

      <section class="grid wide-left section-gap">
        <div class="panel">
          <h2>Model Performance</h2>
          <div class="score-grid" id="scores"></div>
          <div class="grid two-col section-gap">
            <div>
              <h2>Confusion Matrix</h2>
              <div id="confusion"></div>
            </div>
            <div>
              <h2>Classification Report</h2>
              <div id="class-report"></div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>Model Runtime</h2>
          <div id="model-runtime"></div>
        </div>
      </section>

      <section class="grid wide-left section-gap">
        <div class="panel">
          <h2>Recent Predictions</h2>
          <div class="predictions" id="predictions"></div>
        </div>

        <div class="panel">
          <h2>Last Session Transform</h2>
          <pre id="last-transform">{}</pre>
        </div>
      </section>

      <section class="grid two-col section-gap">
        <div class="panel">
          <h2>Runtime Events</h2>
          <div class="events" id="events"></div>
        </div>
        <div class="panel">
          <h2>Artifacts</h2>
          <pre id="artifacts">{}</pre>
        </div>
      </section>
    </main>

    <script>
      /* Тогтмол утга ба runtime state */
      const state = {
        timer: null,
      };

      /* Format helper-үүд */
      function statusClass(status) {
        if (status === "ok") return "ok";
        if (status === "bad" || status === "down") return "bad";
        return "warn";
      }

      function safe(value, fallback = "-") {
        return value === undefined || value === null || value === "" ? fallback : value;
      }

      function pct(value) {
        if (typeof value !== "number" || Number.isNaN(value)) return "-";
        return `${(value * 100).toFixed(1)}%`;
      }

      function fixed(value, digits = 3) {
        if (typeof value !== "number" || Number.isNaN(value)) return "-";
        return value.toFixed(digits);
      }

      function json(value) {
        return JSON.stringify(value ?? {}, null, 2);
      }

      function metric(label, value, sub = "", cls = "") {
        return `
          <div class="metric">
            <div class="metric-label">${label}</div>
            <div class="metric-value ${cls}">${value}</div>
            <div class="metric-sub">${sub}</div>
          </div>
        `;
      }

      function pill(status, label) {
        return `<span class="pill ${statusClass(status)}">${label}</span>`;
      }

      /* Render helper-үүд */
      function renderOverview(data) {
        const stats = data.runtime?.stats || {};
        const model = data.model || {};
        const last = data.runtime?.last_prediction;
        const scoreClass =
          last?.predicted_class === "abandoned"
            ? "value-warn"
            : last?.predicted_class === "converted"
              ? "value-ok"
              : "";

        document.getElementById("overview").innerHTML = [
          metric("Health", safe(data.overall_status, "warn"), `uptime ${safe(data.uptime)}`, data.overall_status === "ok" ? "value-ok" : "value-warn"),
          metric("Model", safe(model.version || data.model_version), `${safe(model.feature_count || data.feature_count)} features`),
          metric("Messages", safe(stats.messages_consumed, 0), "feature_ready consumed"),
          metric("Predictions", safe(stats.predictions_created, 0), "created by XGBoost"),
          metric("Failures", safe(stats.failures, 0), `${safe(stats.dlq_messages, 0)} sent to DLQ`, stats.failures ? "value-bad" : "value-ok"),
          metric("Last Score", last ? fixed(last.score, 3) : "-", safe(last?.predicted_class), scoreClass),
        ].join("");
      }

      function renderConnections(data) {
        const connections = data.connections || {};
        const kafkaChecks = connections.kafka?.checks || [];
        const kafkaDetail = kafkaChecks.length
          ? kafkaChecks.map((item) => `${item.host}:${item.port} ${item.reachable ? "reachable" : "down"}`).join("; ")
          : safe(data.kafka?.details);

        const items = [
          ["Kafka broker", connections.kafka?.status || data.kafka?.status, data.kafka?.label || "Kafka", kafkaDetail],
          ["Kafka consumer", connections.consumer?.status || data.consumer?.status, data.consumer?.label || "Consumer", `input topic: ${safe(connections.kafka?.input_topic)}`],
          ["Kafka producer", connections.producer?.status || data.producer?.status, data.producer?.label || "Producer", `outputs: ${safe(connections.kafka?.output_topic)}, ${safe(connections.kafka?.output_topic_v2)}`],
          ["PostgreSQL", connections.postgres?.status || data.postgres?.status, data.postgres?.label || "PostgreSQL", connections.postgres?.details || data.postgres?.details],
          ["Model artifact", connections.model_storage?.status || data.model?.status, data.model?.label || "Model", connections.model_storage?.path],
          ["Model storage", data.minio?.status, data.minio?.label, data.minio?.details],
          ["SHAP", data.shap_enabled ? "ok" : "warn", data.shap_enabled ? "Enabled" : "Disabled", "top feature explanations"],
          ["LSTM", "warn", "Future work disabled", "ensemble method: xgb_only"],
        ];

        document.getElementById("connections").innerHTML = items
          .map(([name, status, label, detail]) => `
            <div class="connection">
              <div class="connection-head">
                <div class="connection-name">${name}</div>
                ${pill(status, safe(label))}
              </div>
              <div class="connection-detail">${safe(detail)}</div>
            </div>
          `)
          .join("");
      }

      function renderPipeline(data) {
        const stages = data.pipeline || [];
        document.getElementById("pipeline").innerHTML = stages
          .map((stage, index) => `
            <div class="stage">
              ${pill(stage.status, `Stage ${index + 1}`)}
              <div class="stage-title">${safe(stage.stage)}</div>
              <div class="stage-meta">from: ${safe(stage.from)}</div>
              <div class="stage-meta">to: ${safe(stage.to)}</div>
              <div class="stage-meta">${stage.topic ? `topic: ${stage.topic}` : ""}</div>
              <div class="stage-count">${safe(stage.count, 0)}</div>
            </div>
          `)
          .join("");
      }

      function renderScores(data) {
        const metrics = data.model_artifacts?.metrics?.models?.xgboost || {};
        const tuning = data.model_artifacts?.metrics?.threshold_tuning || {};
        const summary = data.model_artifacts?.confusion_summary || {};
        const scores = [
          ["Accuracy", pct(metrics.accuracy), "test set"],
          ["F1", pct(metrics.f1), `validation best ${pct(tuning.validation_f1)}`],
          ["Precision", pct(metrics.precision), "abandoned class"],
          ["Recall", pct(metrics.recall), "abandoned class"],
          ["ROC AUC", pct(metrics.roc_auc), "ranking quality"],
          ["PR AUC", pct(metrics.pr_auc), "positive class quality"],
          ["Threshold", fixed(metrics.threshold ?? tuning.best_threshold, 2), "abandonment cutoff"],
          ["Matrix Acc.", pct(summary.accuracy), `${safe(summary.total, 0)} test sessions`],
        ];
        document.getElementById("scores").innerHTML = scores
          .map(([label, value, sub]) => `
            <div class="score-box">
              <div class="field-label">${label}</div>
              <div class="score-value">${value}</div>
              <div class="metric-sub">${sub}</div>
            </div>
          `)
          .join("");
      }

      function renderConfusion(data) {
        const confusion = data.model_artifacts?.confusion_matrix || {};
        const labels = confusion.labels || ["converted", "abandoned"];
        const matrix = confusion.matrix || [[0, 0], [0, 0]];
        document.getElementById("confusion").innerHTML = `
          <table class="matrix">
            <thead>
              <tr>
                <th>Actual \\ Predicted</th>
                <th>${safe(labels[0])}</th>
                <th>${safe(labels[1])}</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th>${safe(labels[0])}</th>
                <td><span class="matrix-cell matrix-good">${safe(matrix[0]?.[0], 0)}</span><div class="metric-sub">true converted</div></td>
                <td><span class="matrix-cell matrix-risk">${safe(matrix[0]?.[1], 0)}</span><div class="metric-sub">false alarm</div></td>
              </tr>
              <tr>
                <th>${safe(labels[1])}</th>
                <td><span class="matrix-cell matrix-risk">${safe(matrix[1]?.[0], 0)}</span><div class="metric-sub">missed abandon</div></td>
                <td><span class="matrix-cell matrix-good">${safe(matrix[1]?.[1], 0)}</span><div class="metric-sub">true abandoned</div></td>
              </tr>
            </tbody>
          </table>
        `;
      }

      function renderClassReport(data) {
        const report = data.model_artifacts?.classification_report || {};
        const rows = [
          ["converted", report["0"]],
          ["abandoned", report["1"]],
          ["macro avg", report["macro avg"]],
          ["weighted avg", report["weighted avg"]],
        ];
        document.getElementById("class-report").innerHTML = `
          <table>
            <thead>
              <tr><th>Class</th><th>Precision</th><th>Recall</th><th>F1</th><th>Support</th></tr>
            </thead>
            <tbody>
              ${rows.map(([label, row]) => `
                <tr>
                  <td>${label}</td>
                  <td>${pct(row?.precision)}</td>
                  <td>${pct(row?.recall)}</td>
                  <td>${pct(row?.["f1-score"])}</td>
                  <td>${safe(row?.support)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      function renderModelRuntime(data) {
        const model = data.model || {};
        const dataset = data.model_artifacts?.dataset_metadata || {};
        const stats = data.runtime?.stats || {};
        const featureNames = model.feature_names || [];
        document.getElementById("model-runtime").innerHTML = `
          <table>
            <tbody>
              <tr><th>Status</th><td>${pill(model.status, model.label)}</td></tr>
              <tr><th>Name</th><td>${safe(model.name)}</td></tr>
              <tr><th>Version</th><td>${safe(model.version)}</td></tr>
              <tr><th>Variant</th><td>${safe(model.variant)}</td></tr>
              <tr><th>Threshold</th><td>${fixed(model.threshold, 3)}</td></tr>
              <tr><th>Features</th><td>${safe(model.feature_count)} loaded</td></tr>
              <tr><th>Active inference</th><td>${safe(stats.active_inferences, 0)}</td></tr>
              <tr><th>Dataset</th><td>${safe(dataset.dataset || dataset.source || "synthetic MVP dataset")}</td></tr>
              <tr><th>Feature order</th><td>${featureNames.slice(0, 12).join(", ")}${featureNames.length > 12 ? "..." : ""}</td></tr>
            </tbody>
          </table>
        `;
      }

      function renderPredictions(data) {
        const predictions = data.runtime?.recent_predictions || [];
        const target = document.getElementById("predictions");
        if (!predictions.length) {
          target.innerHTML = `<div class="empty">No predictions have been processed since the ML service started.</div>`;
          return;
        }
        target.innerHTML = predictions
          .map((item) => {
            const features = item.top_features || [];
            return `
              <article class="prediction">
                <div class="prediction-head">
                  <div class="prediction-id">${safe(item.session_id)}</div>
                  ${pill(item.predicted_class === "abandoned" ? "warn" : "ok", safe(item.predicted_class))}
                </div>
                <div class="prediction-grid">
                  <div><div class="field-label">Score</div><div>${fixed(item.score, 3)}</div></div>
                  <div><div class="field-label">Threshold</div><div>${fixed(item.threshold, 3)}</div></div>
                  <div><div class="field-label">Model</div><div>${safe(item.model_version)}</div></div>
                  <div><div class="field-label">Created</div><div>${safe(item.created_at)}</div></div>
                </div>
                <div class="feature-list">
                  ${features.map((feature) => {
                    const width = Math.min(100, Math.abs(Number(feature.importance) || 0) * 100).toFixed(0);
                    return `
                      <div class="feature-row">
                        <span>${safe(feature.feature)}</span>
                        <span>${fixed(Number(feature.value), 2)}</span>
                        <div class="bar"><span style="width:${width}%"></span></div>
                      </div>
                    `;
                  }).join("")}
                </div>
              </article>
            `;
          })
          .join("");
      }

      function renderTransform(data) {
        const payload = {
          input_feature_vector: data.runtime?.last_feature_vector || null,
          output_prediction: data.runtime?.last_prediction || null,
          last_error: data.runtime?.last_error || null,
        };
        document.getElementById("last-transform").textContent = json(payload);
      }

      function renderEvents(data) {
        const events = data.recent_events || [];
        const target = document.getElementById("events");
        if (!events.length) {
          target.innerHTML = `<div class="empty">No runtime events yet.</div>`;
          return;
        }
        target.innerHTML = events
          .map((event) => `
            <div class="event ${event.level === "error" ? "error" : ""}">
              <div class="event-time">${safe(event.at)}</div>
              <div>${safe(event.message)}</div>
            </div>
          `)
          .join("");
      }

      function renderArtifacts(data) {
        const artifacts = data.model_artifacts || {};
        document.getElementById("artifacts").textContent = json({
          model_path: artifacts.model_path,
          artifacts: artifacts.artifacts,
          variant_metrics: artifacts.variant_metrics,
          dataset_metadata: artifacts.dataset_metadata,
        });
      }

      function render(data) {
        const overall = data.overall_status || data.status || "warn";
        const overallPill = document.getElementById("overall-pill");
        overallPill.className = `pill ${statusClass(overall)}`;
        overallPill.textContent = overall === "ok" ? "All systems running" : "Attention needed";
        document.getElementById("last-updated").textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        document.getElementById("worker").textContent = `worker: ${safe(data.worker)}`;

        renderOverview(data);
        renderConnections(data);
        renderPipeline(data);
        renderScores(data);
        renderConfusion(data);
        renderClassReport(data);
        renderModelRuntime(data);
        renderPredictions(data);
        renderTransform(data);
        renderEvents(data);
        renderArtifacts(data);
      }

      /* Fetch ба refresh handler */
      async function loadStatus() {
        try {
          const response = await fetch("/internal/status", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          render(await response.json());
        } catch (error) {
          const overallPill = document.getElementById("overall-pill");
          overallPill.className = "pill bad";
          overallPill.textContent = "Viewer disconnected";
          document.getElementById("last-updated").textContent =
            `Last updated: ${new Date().toLocaleTimeString()} (${error.message})`;
        }
      }

      document.getElementById("refresh").addEventListener("click", loadStatus);
      /* Startup loop */
      loadStatus();
      state.timer = setInterval(loadStatus, 3000);
    </script>
  </body>
</html>
