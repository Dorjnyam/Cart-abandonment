services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGCTLTIMEOUT: ${PGCTLTIMEOUT:-300}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 10

  kafka-init:
    image: apache/kafka:3.7.1
    command:
      - bash
      - -ec
      - |
        kafka_topics() {
          local output status
          output=$$(/opt/kafka/bin/kafka-topics.sh "$$@" 2>&1) || status=$$?
          printf '%s\n' "$$output" | grep -v "Due to limitations in metric names" || true
          return "$${status:-0}"
        }

        until kafka_topics --bootstrap-server kafka:9092 --list >/dev/null; do
          echo "waiting for kafka"
          sleep 5
        done

        kafka_topics --bootstrap-server kafka:9092 --create --if-not-exists --topic raw_events --partitions 1 --replication-factor 1
        kafka_topics --bootstrap-server kafka:9092 --create --if-not-exists --topic session_enriched --partitions 1 --replication-factor 1
        kafka_topics --bootstrap-server kafka:9092 --create --if-not-exists --topic feature_ready --partitions 1 --replication-factor 1
        kafka_topics --bootstrap-server kafka:9092 --create --if-not-exists --topic prediction_done --partitions 1 --replication-factor 1
        kafka_topics --bootstrap-server kafka:9092 --create --if-not-exists --topic prediction_done_v2 --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  main_service:
    build: ./main_service
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo_tenant &&
             gunicorn main_service.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-main-service}
      ALLOWED_HOSTS: localhost,127.0.0.1,main_service
      FRONTEND_URL: http://localhost:3001
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-cartdb}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PREDICTION_DONE_TOPIC: prediction_done
      KAFKA_CONSUMER_GROUP: main-service-predictions
      KAFKA_AUTO_OFFSET_RESET: earliest
      DEMO_TENANT_EXTERNAL_ID: ${DEMO_TENANT_EXTERNAL_ID:-00000000-0000-0000-0000-000000000001}
      DEMO_TENANT_NAME: Thesis Demo Store
      DEMO_TENANT_DOMAIN: demo.local
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-demo@example.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-change-me-demo-password}
      DEMO_OBSERVER_API_KEY: ${DEMO_OBSERVER_API_KEY:-tk_full_demo_mvp}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DUCKDB_PATH: /data/duckdb/analytics.duckdb
    ports:
      - "8000:8000"
    volumes:
      - duckdb_data:/data/duckdb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  main_prediction_consumer:
    build: ./main_service
    command: python manage.py consume_prediction_done
    healthcheck:
      disable: true
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-main-service}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-cartdb}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PREDICTION_DONE_TOPIC: prediction_done
      KAFKA_CONSUMER_GROUP: main-service-predictions
      KAFKA_AUTO_OFFSET_RESET: earliest
      DEMO_TENANT_EXTERNAL_ID: ${DEMO_TENANT_EXTERNAL_ID:-00000000-0000-0000-0000-000000000001}
    depends_on:
      main_service:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  observer:
    build: ./observer_experiment
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cartdb}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      SESSION_SERVICE_URL: http://session_service:8002/ingest/raw-event
      OBSERVER_CORS_ORIGINS: "*"
      # Local/dev default is prefix validation so API keys generated in analytics work immediately.
      # Set OBSERVER_API_KEYS to a comma-separated allowlist when you want exact-key enforcement.
      OBSERVER_API_KEYS: ${OBSERVER_API_KEYS:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  session_service:
    build:
      context: ./session
      dockerfile: session/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_EVENTS_TOPIC: raw_events
      SESSION_ENRICHED_TOPIC: session_enriched
      SESSION_CONSUMER_GROUP: session-svc-group
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PG_DSN: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cartdb}
      SESSION_DEFAULT_TENANT_ID: ${DEMO_TENANT_EXTERNAL_ID:-00000000-0000-0000-0000-000000000001}
      SESSION_EVENT_SOURCE: both
      SESSION_DEDUPE_EVENT_ID: "1"
      SESSION_WINDOWS: 30,60,90
      SESSION_TTL_SECONDS: "120"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  session_celery:
    build:
      context: ./session
      dockerfile: session/Dockerfile
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_EVENTS_TOPIC: raw_events
      SESSION_ENRICHED_TOPIC: session_enriched
      SESSION_CONSUMER_GROUP: session-svc-group
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PG_DSN: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cartdb}
      SESSION_DEFAULT_TENANT_ID: ${DEMO_TENANT_EXTERNAL_ID:-00000000-0000-0000-0000-000000000001}
      SESSION_EVENT_SOURCE: both
      SESSION_DEDUPE_EVENT_ID: "1"
      SESSION_WINDOWS: 30,60,90
      SESSION_TTL_SECONDS: "120"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  feature_service:
    build: ./feature/feature_svc
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SESSION_ENRICHED_TOPIC: session_enriched
      FEATURE_READY_TOPIC: feature_ready
      FEATURE_CONSUMER_GROUP: feature-svc-group
      FEATURE_SET: full
      FEATURE_VERSION: "1.0.0"
      FEATURE_VARIANT: C
      LOG_LEVEL: INFO
      PORT: "8003"
    ports:
      - "8003:8003"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  ml_service:
    build: ./ml
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: feature_ready
      KAFKA_OUTPUT_TOPIC: prediction_done
      KAFKA_CONSUMER_GROUP: ml-svc-group
      PG_DSN: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cartdb}
      MODEL_PATH_XGBOOST: ./models/xgb_cart_abandonment.joblib
      MODEL_VERSION_XGBOOST: xgboost-synthetic-mvp
      ABANDON_THRESHOLD: "0.5"
      SHAP_ENABLED: "true"
    ports:
      - "8004:8004"
    volumes:
      - ./ml/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  analytics_dashboard:
    build: ./cart_analytic
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_AUTH_MODE: jwt
      NEXT_PUBLIC_MOCK_FALLBACK: "false"
    ports:
      - "3001:3001"
    depends_on:
      main_service:
        condition: service_started

  demo_ecommerce:
    build:
      context: ./sneaker-store
      args:
        NEXT_PUBLIC_OBSERVER_URL: /api/observer
        NEXT_PUBLIC_OBSERVER_SNIPPET_KEY: ${DEMO_OBSERVER_API_KEY:-tk_full_demo_mvp}
        NEXT_PUBLIC_OBSERVER_TENANT_ID: ${NEXT_PUBLIC_OBSERVER_TENANT_ID:-00000000-0000-0000-0000-000000000001}
    command: >
      sh -c "node -e \"const { Pool } = require('pg'); const pool = new Pool({ connectionString: process.env.POSTGRES_ADMIN_URL }); pool.query('CREATE DATABASE sneakerdb').catch((e) => { if (e.code !== '42P04') throw e; }).finally(() => pool.end());\" &&
             npx prisma db push &&
             npm run prisma:seed &&
             npm run start -- -H 0.0.0.0 -p 3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sneakerdb
      POSTGRES_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      NEXTAUTH_URL: ${DEMO_ECOMMERCE_PUBLIC_URL:-http://localhost:3000}
      NEXTAUTH_URL_INTERNAL: http://demo_ecommerce:3000
      NEXTAUTH_SECRET: change-me-nextauth-secret
      ADMIN_EMAIL: demo-shop@example.com
      ADMIN_PASSWORD: change-me-demo-shop-password
      NEXT_PUBLIC_OBSERVER_URL: /api/observer
      OBSERVER_SERVER_URL: http://observer:8001
      NEXT_PUBLIC_OBSERVER_SNIPPET_KEY: ${DEMO_OBSERVER_API_KEY:-tk_full_demo_mvp}
      NEXT_PUBLIC_OBSERVER_TENANT_ID: ${NEXT_PUBLIC_OBSERVER_TENANT_ID:-00000000-0000-0000-0000-000000000001}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      observer:
        condition: service_started

volumes:
  pg_data:
  duckdb_data:
